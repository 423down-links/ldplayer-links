name: Update WeChat Version (3h)

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install 7z for NSIS version detection
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Check WeChat version only
        run: |
          python3 -c "
          import json, sys
          sys.path.insert(0, '.')
          from check_versions import find_latest, PRODUCTS

          # 只检测微信
          wechat = None
          for p in PRODUCTS:
              if p['name'] == 'WeChat':
                  wechat = p
                  break

          if not wechat:
              print('WeChat config not found')
              sys.exit(0)

          print('检测微信版本...')
          info = find_latest(wechat)
          print(f'检测到版本: {info[\"version\"]}')

          # 读取当前数据
          with open('data.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          # 查找微信当前版本
          changed = False
          for i, p in enumerate(data['products']):
              if p['name'] == 'WeChat':
                  old_version = p['version']
                  old_size = p['size_mb']
                  print(f'当前版本: {old_version}, 大小: {old_size}MB')
                  print(f'新版本: {info[\"version\"]}, 大小: {info[\"size_mb\"]}MB')
                  if old_version != info['version'] or old_size != info['size_mb']:
                      data['products'][i] = info
                      changed = True
                      print('版本有变化，更新数据')
                  else:
                      print('版本无变化')
                  break

          if changed:
              data['updated_at'] = __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat()
              with open('data.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print('WECHAT_CHANGED=true' >> '\$GITHUB_ENV')
          else:
              print('WECHAT_CHANGED=false' >> '\$GITHUB_ENV')
          "

      - name: Embed data into HTML
        if: env.WECHAT_CHANGED == 'true'
        run: python embed_data.py

      - name: Commit and push
        if: env.WECHAT_CHANGED == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Auto-update WeChat version"
          git push
