name: Update Software Versions (6h full)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install 7z for NSIS version detection
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Check all versions (parallel, full update)
        run: python check_versions.py --parallel 6

      - name: Embed data into HTML
        run: python embed_data.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update software versions (6h full)" && git push)
