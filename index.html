    return db - da;
  });

  html += '<th class="col-software">软件</th>';

  html += '<th class="hide-mobile col-size">大小</th>';

  sorted.forEach(p => {

  });

  html += '</tbody></table>';

  content.innerHTML = html;
  document.getElementById('updatedBadge').textContent = '共 ' + data.products.length + ' 款软件';
  document.getElementById('lastUpdated').textContent = new Date(data.updated_at).toLocaleString('zh-CN');
}

async function loadData() {
  try {
    const resp = await fetch('data.json?t=' + Date.now());
    if (resp.ok) {
      data = await resp.json();
    }
  } catch (e) {}
  render();
}
